uru'nu, çölü ve kutbu dolaştı; her yerde yeni arkadaşlar edindi. Ama hiçbir yerin otu çiftliğindeki kadar tatlı değildi. Artık vakti geldi: Papatya çiftliğine geri dönüyor ve en sevdiği çayırda mutlu mutlu otlamaya devam ediyor. Teşekkürler!": "Daisy roamed the gardens, meadows, forests, rivers, snowy peaks, the Lava Pit, the desert and the pole, making new friends everywhere. But nowhere was the grass as sweet as on her farm. Now the time has come: Daisy is heading back to her farm to happily graze in her favourite meadow. Thank you!", "Çöl": "Desert", "Kutup": "Polar", "Karlı dağa tırmanış! Buz kalın, hamleler sayılı. Zirveyi geçince yol yepyeni diyarlara uzanıyor.": "Up the snowy peak! The ice is thick and moves are few. Past the summit, the road leads to brand-new lands.", "Dağın ardında sıcacık bir volkan vadisi! Yanardağlar hafif hafif püskürüyor. Kızgın kayaların yanında eşleşme yap, yolu aç.": "Beyond the mountain lies a warm volcano valley! The volcanoes puff gently. Match next to the hot rocks to clear the way.", "Lav Çukuru'nu geçince uçsuz bucaksız bir çöl! Kaktüsler yolu kapatmış, akrepler ve kertenkeleler etrafta. Kaktüslerin yanında eşleşme yap.": "Past the Lava Pit, an endless desert! Cacti block the road, with scorpions and lizards all around. Match next to the cacti.", "Son durak buz gibi kutup! Penguenler kayıyor, kutup ayıları selam veriyor. Buzları kır; Papatya'nın zili çalsın, şenlik başlasın!": "Last stop: the icy pole! Penguins slide and polar bears wave hello. Break the ice; let Daisy's bell ring and the festival begin!", "Yeni: Volkanik kaya! Yanında eşleşme yap": "New: volcanic rocks! Match next to them", "Yeni: Kaktüs! Yanında eşleşme yap": "New: cacti! Match next to them", "Yeni: Kutup buzu! Kalın buzlar iki kez kırılır": "New: polar ice! Thick ice breaks in two hits", "Her şey dolduruldu": "Everything topped up","Eğlence Diyarı": "Fun Land", "Eğlence": "Fun", "Bol kiraz, bol nar, bol kombo!": "Loads of cherries, pomegranates and combos!     else if(f.t==='coin'){if(f.d>0){f.d-=dt;return;}f.p=(f.p||0)+dt/650;const p=Math.min(1,f.p),e=p*p;

      if(p<.2){const q=Math.sin(p/.2*Math.PI/2);x=f.x+f.ox*q;y=f.y+f.oy*q;}else{const q=(p-.2)/.8,e=q*q*(3-2*q),sx=f.x+f.ox,sy=f.y+f.oy;x=sx+(tx2-sx)*e+Math.sin(q*Math.PI)*f.sw*.5;y=sy+(ty2-sy)*e-Math.sin(q*Math.PI)*60;}
      f.trail.push([x,y]);if(f.trail.length>7)f.trail.shift();f.trail.forEach(([qx,qy],i)=>{ctx.globalAlpha=(i+1)/f.trail.length*.4;dot(qx,qy,1.6+i*.45,'#ffe28a');});ctx.globalAlpha=1;
      const fl=Math.abs(Math.cos(now/85+f.ph));ctx.save();ctx.translate(x,y);ctx.scale(.3+.7*fl,1);coinIcon(0,0,8.5);ctx.restore();if(fl>.92){ctx.globalAlpha=.8;star(x-3,y-3,2.6,'#fff');ctx.globalAlpha=1;}
      if(p>=1){f.l=0;coinPending=Math.max(0,coinPending-f.v);dispCoins+=f.v;coinBump=1;coinGlow=1;coinTink();for(let q=0;q<4;q++){const an=Math.random()*6.28;uiFx.push({t:'spark',x:tx2,y:ty2,vx:Math.cos(an)*1.7,vy:Math.sin(an)*1.7,l:.7});}}}
    else if(f.t==='spark'){f.x+=f.vx;f.y+=f.vy;f.vx*=.95;f.vy*=.95;f.l-=.03;ctx.globalAlpha=Math.max(0,f.l);star(f.x,f.y,4*f.l+1.5,'#ffd54a');ctx.globalAlpha=1;}
    else if(f.t==='leafF'){f.t2=(f.t2||0)+dt;f.x+=f.vx+Math.sin(f.t2/400)*.6;f.y+=f.vy;if(f.y>H+10)f.l=0;ctx.globalAlpha=.85;leaf(f.x,f.y,f.t2/600,10,f.col);ctx.globalAlpha=1;}
    else if(f.t==='fly'){if(screen!=='game'){f.l=0;return;}if(f.d>0){f.d-=dt;return;}f.p=(f.p||0)+dt/560;const p=Math.min(1,f.p),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      const x=f.x+(f.tx-f.x)*e+Math.sin(p*Math.PI)*24,y=f.y+(f.ty-f.y)*e-Math.sin(p*Math.PI)*40;ctx.globalAlpha=.25;dot(x,y+3,9*(1-.3*e),'#000');ctx.globalAlpha=1;{const bs=blockSkin;blockSkin=skinFor(worldOf(lvl));fruit(f.k,x,y,11*(1-.3*e));blockSkin=bs;}
      if(p>=1){f.l=0;goalBump[f.kk]=1;sGoal();for(let q=0;q<4;q++){const an=q*1.57+.4;uiFx.push({t:'spark',x:f.tx,y:f.ty,vx:Math.cos(an)*1.6,vy:Math.sin(an)*1.6,l:.7});}}}
    else if(f.t==='basketFly'){f.p=(f.p||0)+dt/650;const p=Math.min(1,f.p),e=1-Math.pow(1-p,3),x=f.x+(f.tx-f.x)*e-Math.sin(p*Math.PI)*40,y=f.y+(f.ty-f.y)*e-Math.sin(p*Math.PI)*30;
      ctx.save();ctx.translate(x,y);ctx.scale(1.6-.5*e,1.6-.5*e);dot(0,0,15,'#fff7e6');basketIcon(0,0);ctx.restore();
      if(p>=1){f.l=0;movesBump=1.6;for(let q=0;q<10;q++){const an=q*.628;uiFx.push({t:'spark',x:f.tx,y:f.ty,vx:Math.cos(an)*2.4,vy:Math.sin(an)*2.4,l:1});}}}
    else if(f.t==='fw'){if(f.d>0){f.d-=dt;if(f.d<=0)tone(1400+Math.random()*600,'sine',.025,.25);return;}f.p=(f.p||0)+dt/900;const p=Math.min(1,f.p);if(p>=1){f.l=0;return;}
      ctx.globalAlpha=1-p;for(let q=0;q<14;q++){const an=q*.449,r=8+p*58;dot(f.x+Math.cos(an)*r,f.y+Math.sin(an)*r+p*p*20,2.6*(1-p)+.8,f.col);}ctx.globalAlpha=1;}
    else if(f.t==='hb'){const a=now-f.t0;if(a>1250){f.l=0;return;}const S2=17;

    else if(f.t==='leafB'){f.x+=f.vx;f.y+=f.vy;f.vy+=.12;f.rot+=.15;f.l-=.02;ctx.globalAlpha=Math.max(0,f.l);leaf(f.x,f.y,f.rot,9,f.col);ctx.globalAlpha=1;}
    else if(f.t==='dust'){f.r+=.18;f.l-=.035;f.y-=.2;ctx.globalAlpha=Math.max(0,f.l)*.5;dot(f.x,f.y,f.r,'#c9b48a');ctx.globalAlpha=1;}

  });

function frame(t){
  idleNow=screen!=='game'&&!modal&&!pd&&!portal&&!ctrans&&now-lastInputT>8000&&!uiFx.some(f=>f.t==='coinF'||f.t==='fw');if(idleNow){frameSkip^=1;if(frameSkip){requestAnimationFrame(frame);return;}}
  if(!idleNow){perfAcc+=Math.min(dt,100);perfN++;}if(perfN>=90){const av=perfAcc/perfN;perfAcc=0;perfN=0;if(now>5000&&av>23&&QDPR>1.3&&!(typeof document!=='undefined'&&document.hidden)){QDPR=Math.max(1.3,+(QDPR-.35).toFixed(2));try{localStorage.setItem('fv_q',String(QDPR));}catch(e){}resize();}}
  dt=Math.min(50,t-(now||t));now=t;
  ctx.setTransform(scale,0,0,scale,0,0);hits=[];sliders=[];
  if(t-lastTick>1000){lastTick=t;tickLives();}
  if(coinPending>coinDeferred&&!uiFx.some(f=>f.t==='coinF'))coinPending=coinDeferred;
  {const tg=save.coins-coinPending;dispCoins+=(tg-dispCoins)*.15;if(Math.abs(tg-dispCoins)<.5)dispCoins=tg;}if(coinGlow>0)coinGlow=Math.max(0,coinGlow-dt/500);
  if(save.ratePending&&screen==='map'&&!modal&&!ctrans&&!portal&&!cowAnim&&coinDeferred===0){save.ratePending=false;persist();openModal('rate',{sel:0});}
  if(coinDeferred>0&&(screen==='map'||screen==='menu')&&!modal&&!ctrans&&!portal){flyCoins(coinDeferred,W/2,H*.5,250,true);coinDeferred=0;}
  if(cowJump>0)cowJump=Math.max(0,cowJump-dt/500);if(coinBump>0)coinBump=Math.max(0,coinBump-dt/300);if(lifeFlash>0)lifeFlash=Math.max(0,lifeFlash-dt/700);
  if(screen==='splash')drawSplash(t);
  else if(screen==='login')drawLogin(t);
  else if(screen==='menu')drawMenu(t);
  else if(screen==='map')drawMap(t);
  else if(screen==='settings')drawSettings(t);
  else if(screen==='shop')drawShop(t);
  else if(screen==='ach')drawAch(t);
  else if(screen==='profile')drawProfile(t);
  else if(screen==='story')drawStory(t);
  else if(screen==='funmap')drawFunMap(t);
  else if(screen==='outro')drawOutro(t);
  else if(screen==='game'){
    drawGame(t);updateBlasts();updateWind();
    if(gstate==='play'&&pending&&!busy()&&!fx.some(f=>f.t==='ring')){if(chainQ.length)fireChain();else{pending=false;evaluate();}}
    if(gstate==='play'&&!modal&&now-introT>1500)elapsed+=dt;
    if(funMode&&gstate==='play'&&!modal&&now-introT>1500&&!funEnd){funTime-=dt;const sec=Math.ceil(funTime/1000);if(sec<=10&&sec>0&&sec!==funTick){funTick=sec;tone(sec<=3?1046:880,'triangle',.03,.08);}
      if(funTime<=0){funTime=0;funEnd=true;drawing=false;path=[];loop=false;vineTip=null;bigText('Süre doldu!','#9b3b8f');}}
    if(funMode&&funEnd&&gstate==='play'&&!busy()&&!pending&&!chainQ.length)finishFun();
    if(gstate==='celebrate')updateCelebrate();
    if(gstate==='play'&&!busy()&&!drawing&&!modal&&!hintCells&&now-lastAct>7000)hintCells=findHint();
    if(lvl===0&&!save.tutDone&&!tut&&gstate==='play'&&!busy()&&!modal)tut=findTut();
  }
  drawKit(t);
  if(modal){hits=[];sliders=[];drawModal(t);}
  drawUiFx();drawClouds();drawToasts();drawPortal();
  if(fadeA>0){ctx.fillStyle=`rgba(255,250,240,${fadeA})`;ctx.fillRect(0,0,W,H);fadeA=Math.max(0,fadeA-dt/260);}
  requestAnimationFrame(frame);
}
